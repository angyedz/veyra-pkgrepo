name: Publish Veyra RPM repository

on:
  push:
    branches: [main]
    paths:
      - 'rpms/**'
      - 'scripts/**'
      - '.github/workflows/publish-rpm.yml'
  workflow_dispatch:
    inputs:
      channel:
        description: Package channel to publish (main promotes the tested testing snapshot)
        required: true
        type: choice
        options: [testing, main]
        default: testing
      version:
        description: Version X.Y.Z for a release (required only for manual publish)
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: veyra-rpm-publish-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: fedora:44
    steps:
      - name: Install Git for source checkout
        run: dnf -y install git

      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install RPM repository tools
        run: dnf -y install rpm-build rpm-sign createrepo_c gnupg2 dnf git findutils coreutils squashfs-tools gh tar gzip

      - name: Resolve package channel
        id: channel
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            channel=testing
          else
            channel='${{ inputs.channel }}'
          fi
          case "$channel" in testing|main) ;; *) echo "Unsupported package channel: $channel" >&2; exit 1 ;; esac
          echo "name=$channel" >> "$GITHUB_OUTPUT"

      - name: Import RPM signing key or prepare a CI-only key
        id: signing
        env:
          GNUPGHOME: ${{ runner.temp }}/veyra-rpm-gnupg
          VEYRA_RPM_GPG_PRIVATE_KEY_B64: ${{ secrets.VEYRA_RPM_GPG_PRIVATE_KEY_B64 }}
          VEYRA_PACKAGE_CHANNEL: ${{ steps.channel.outputs.name }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$GNUPGHOME"
          if [ -n "$VEYRA_RPM_GPG_PRIVATE_KEY_B64" ]; then
            key_file="$RUNNER_TEMP/veyra-rpm-private-key.asc"
            printf '%s' "$VEYRA_RPM_GPG_PRIVATE_KEY_B64" | base64 --decode > "$key_file"
            chmod 0600 "$key_file"
            gpg --batch --import "$key_file"
            rm -f "$key_file"
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          elif [ "$VEYRA_PACKAGE_CHANNEL" = testing ]; then
            gpg --batch --quiet --pinentry-mode loopback --passphrase '' \
              --quick-generate-key "Veyra CI ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" rsa3072 sign 1d
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'Stable promotion requires VEYRA_RPM_GPG_PRIVATE_KEY_B64.' >&2
            exit 1
          fi
          fingerprint=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')
          test -n "$fingerprint"
          echo "VEYRA_RPM_GPG_FINGERPRINT=$fingerprint" >> "$GITHUB_ENV"

      - name: Build testing package snapshot
        if: steps.channel.outputs.name == 'testing'
        env:
          GNUPGHOME: ${{ runner.temp }}/veyra-rpm-gnupg
        run: bash scripts/build-rpm-repo.sh "$RUNNER_TEMP/veyra-repo/x86_64"

      - name: Promote exactly the signed testing snapshot (never rebuild stable differently)
        if: steps.channel.outputs.name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          GNUPGHOME: ${{ runner.temp }}/veyra-rpm-gnupg
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          mkdir -p "$RUNNER_TEMP/veyra-promotion" "$RUNNER_TEMP/veyra-repo"
          gh release download "rpm-v$REQUESTED_VERSION-testing" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/veyra-promotion" \
            --pattern 'veyra-rpm-repo-x86_64.tar.gz*'
          (cd "$RUNNER_TEMP/veyra-promotion" && sha256sum -c veyra-rpm-repo-x86_64.tar.gz.sha256)
          # The client only permits x86_64 regular-file/directory archives.
          python3 - "$RUNNER_TEMP/veyra-promotion/veyra-rpm-repo-x86_64.tar.gz" <<'PY'
          import sys, tarfile
          from pathlib import PurePosixPath
          with tarfile.open(sys.argv[1], "r:gz") as tar:
              members = tar.getmembers()
              if len(members) > 100000 or sum(x.size for x in members) > 1024**3:
                  raise SystemExit("RPM snapshot exceeds vpkg archive safety limits")
              for item in members:
                  parts = PurePosixPath(item.name).parts
                  if not parts or parts[0] != "x86_64" or ".." in parts or not (item.isfile() or item.isdir()):
                      raise SystemExit("RPM snapshot contains an unsafe archive member")
          PY
          tar -xzf "$RUNNER_TEMP/veyra-promotion/veyra-rpm-repo-x86_64.tar.gz" -C "$RUNNER_TEMP/veyra-repo"
          repo="$RUNNER_TEMP/veyra-repo/x86_64"
          test -s "$repo/repodata/repomd.xml"
          gpg --batch --verify "$repo/repodata/repomd.xml.asc" "$repo/repodata/repomd.xml"
          cmp "$repo/RPM-GPG-KEY-VEYRA" <(gpg --batch --armor --export "$VEYRA_RPM_GPG_FINGERPRINT")

      - name: Create release archive with expected vpkg x86_64 layout
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/veyra-repo/x86_64"
          test -s "$repo/repodata/repomd.xml"
          test -s "$repo/repodata/repomd.xml.asc"
          test -s "$repo/RPM-GPG-KEY-VEYRA"
          mkdir -p "$RUNNER_TEMP/veyra-release-assets"
          (
            cd "$RUNNER_TEMP/veyra-repo"
            tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
              -czf "$RUNNER_TEMP/veyra-release-assets/veyra-rpm-repo-x86_64.tar.gz" x86_64
          )
          cd "$RUNNER_TEMP/veyra-release-assets"
          asset=veyra-rpm-repo-x86_64.tar.gz
          test "$(stat -c %s "$asset")" -le 536870912 || {
            echo "RPM asset exceeds the vpkg 512 MiB client cap (stricter than GitHub 2 GB)." >&2; exit 1;
          }
          sha256sum "$asset" > "$asset.sha256"
          sha256sum -c "$asset.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: veyra-${{ steps.channel.outputs.name }}-rpm-release-assets-${{ github.sha }}
          path: ${{ runner.temp }}/veyra-release-assets/
          retention-days: 14
          if-no-files-found: error

      - name: Publish repository strictly from GitHub Releases
        if: github.event_name == 'workflow_dispatch' && steps.signing.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ steps.channel.outputs.name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release version must be X.Y.Z." >&2; exit 1;
          }
          tag="rpm-v$REQUESTED_VERSION"
          extra=()
          if [[ "$CHANNEL" == testing ]]; then tag="$tag-testing"; extra=(--prerelease); fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing signed release $tag" >&2; exit 1;
          fi
          cd "$RUNNER_TEMP/veyra-release-assets"
          gh release create "$tag" \
            veyra-rpm-repo-x86_64.tar.gz veyra-rpm-repo-x86_64.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Veyra RPM $REQUESTED_VERSION ($CHANNEL)" \
            --notes "Signed Fedora 44 vpkg extension RPM snapshot from $GITHUB_SHA" \
            "${extra[@]}"

      - name: Verify downloaded GitHub Release snapshot matches signed metadata
        if: github.event_name == 'workflow_dispatch' && steps.signing.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GNUPGHOME: ${{ runner.temp }}/veyra-rpm-gnupg
          CHANNEL: ${{ steps.channel.outputs.name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="rpm-v$REQUESTED_VERSION"
          [[ "$CHANNEL" == testing ]] && tag="$tag-testing"
          mkdir -p "$RUNNER_TEMP/downloaded-rpm-release" "$RUNNER_TEMP/downloaded-rpm-repo"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern 'veyra-rpm-repo-x86_64.tar.gz*' \
            --dir "$RUNNER_TEMP/downloaded-rpm-release"
          cd "$RUNNER_TEMP/downloaded-rpm-release"
          sha256sum -c veyra-rpm-repo-x86_64.tar.gz.sha256
          tar -xzf veyra-rpm-repo-x86_64.tar.gz -C "$RUNNER_TEMP/downloaded-rpm-repo"
          repo="$RUNNER_TEMP/downloaded-rpm-repo/x86_64"
          gpg --batch --verify "$repo/repodata/repomd.xml.asc" "$repo/repodata/repomd.xml"
          test -s "$repo"/veyra-*.rpm
          echo "GitHub Releases downloaded RPM snapshot and pinned-signature roundtrip passed."

      - name: Note missing private signing key
        if: steps.signing.outputs.publish != 'true'
        run: echo 'Release publication skipped: signing secret not configured; CI artifact only.' >> "$GITHUB_STEP_SUMMARY"
