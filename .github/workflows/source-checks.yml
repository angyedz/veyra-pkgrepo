name: Veyra RPM source checks

on:
  push:
    branches: [testing, stable]
    paths:
      - 'rpms/**'
      - 'scripts/**'
      - '.github/workflows/source-checks.yml'
      - '.github/workflows/packages.yml'
  pull_request:
    branches: [testing, stable]
    paths:
      - 'rpms/**'
      - 'scripts/**'
      - '.github/workflows/source-checks.yml'
      - '.github/workflows/packages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
      - name: Install spec parser
        run: dnf -y install rpm-build bash
      - name: Validate package specs and build script
        run: |
          set -euo pipefail
          bash -n scripts/build-rpm-repo.sh
          shopt -s nullglob
          specs=(rpms/*/*.spec)
          test "${#specs[@]}" -gt 0
          for spec in "${specs[@]}"; do
            rpmspec --parse "$spec" >/dev/null
            echo "Validated $spec"
          done
          test -s rpms/veyra-release/SOURCES/release.txt
