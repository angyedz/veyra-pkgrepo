name: Veyra RPM source checks

on:
  push:
    branches: [main]
    paths:
      - 'rpms/**'
      - 'sources/**'
      - 'scripts/**'
      - '.github/workflows/source-checks.yml'
      - '.github/workflows/packages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'rpms/**'
      - 'sources/**'
      - 'scripts/**'
      - '.github/workflows/source-checks.yml'
      - '.github/workflows/packages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
      - name: Install spec parser
        run: dnf -y install rpm-build bash python3
      - name: Validate package specs and build script
        run: |
          set -euo pipefail
          bash -n scripts/build-rpm-repo.sh
          shopt -s nullglob
          specs=(rpms/*/*.spec)
          test "${#specs[@]}" -gt 0
          for spec in "${specs[@]}"; do
            rpmspec --parse "$spec" >/dev/null
            echo "Validated $spec"
          done
          test -s rpms/veyra-release/SOURCES/release.txt
          python3 -m py_compile sources/veyra-vforge/usr/bin/vforge
          python3 -m unittest discover -s tests -p 'test_vforge.py' -v
          for source_dir in sources/*/; do
            test -d "$source_dir" || continue
            test ! -L "${source_dir%/}"
            printf 'Validated source tree %s\n' "$source_dir"
          done
