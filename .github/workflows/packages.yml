name: Veyra RPM package checks

on:
  push:
    branches: [main]
    paths:
      - 'rpms/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'README.md'
  pull_request:
    branches: [main]
    paths:
      - 'rpms/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veyra-rpm-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: fedora:44
    steps:
      - uses: actions/checkout@v4

      - name: Install RPM repository tools
        run: dnf -y install rpm-build rpm-sign createrepo_c gnupg2 dnf git findutils coreutils squashfs-tools

      - name: Create disposable CI signing key
        env:
          GNUPGHOME: ${{ runner.temp }}/veyra-ci-gnupg
        run: |
          set -euo pipefail
          install -d -m 0700 "$GNUPGHOME"
          gpg --batch --quiet --pinentry-mode loopback --passphrase '' \
            --quick-generate-key "Veyra CI ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" rsa3072 sign 1d
          fingerprint=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')
          test -n "$fingerprint"
          echo "VEYRA_RPM_GPG_FINGERPRINT=$fingerprint" >> "$GITHUB_ENV"

      - name: Build and sign repository snapshot
        env:
          GNUPGHOME: ${{ runner.temp }}/veyra-ci-gnupg
        run: bash scripts/build-rpm-repo.sh "$RUNNER_TEMP/veyra-repo/x86_64"

      - name: Install the Veyra package from the generated repository
        run: |
          set -euo pipefail
          repo_dir="$RUNNER_TEMP/veyra-repo/x86_64"
          rpm --import "$repo_dir/RPM-GPG-KEY-VEYRA"
          cat > /etc/yum.repos.d/veyra-ci.repo <<EOF
          [veyra-ci]
          name=Veyra CI repository
          baseurl=file://$repo_dir
          enabled=1
          gpgcheck=1
          repo_gpgcheck=1
          gpgkey=file://$repo_dir/RPM-GPG-KEY-VEYRA
          metadata_expire=0
          EOF
          dnf -y --disablerepo='*' --enablerepo=veyra-ci install veyra-release
          test -s /var/lib/extensions/veyra-release.raw

      - uses: actions/upload-artifact@v4
        with:
          name: veyra-rpm-repository-${{ github.sha }}
          path: ${{ runner.temp }}/veyra-repo/x86_64/
          retention-days: 7
          if-no-files-found: error
